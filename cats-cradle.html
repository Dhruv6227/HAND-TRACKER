<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT'S CRADLE — NEON STRINGS</title>

  <!-- MediaPipe Hands + Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000810;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      cursor: none;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Hidden video – only used as MediaPipe input */
    #video {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Main canvas for all drawing */
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* CRT scanline overlay */
    #scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 40;
      mix-blend-mode: multiply;
    }

    /* Vignette corners */
    #vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%,
        rgba(0, 0, 0, 0.75) 100%
      );
      pointer-events: none;
      z-index: 41;
    }

    /* HUD Title */
    #hud-title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(12px, 2vw, 18px);
      letter-spacing: 0.35em;
      color: #00ffff;
      text-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff,
        0 0 40px rgba(0,255,255,0.4);
      z-index: 50;
      white-space: nowrap;
    }

    /* Status bar */
    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(0,255,255,0.55);
      text-shadow: 0 0 8px rgba(0,255,255,0.4);
      z-index: 50;
      transition: opacity 1.5s ease;
      white-space: nowrap;
    }

    /* Left / Right hand labels */
    .hand-label {
      position: fixed;
      top: 50%;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 50;
      pointer-events: none;
    }
    #label-left  { left: 16px;  color: #00ffff; text-shadow: 0 0 10px #00ffff; }
    #label-right { right: 16px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    #label-left.visible, #label-right.visible { opacity: 0.7; }

    /* Touch counter */
    #touch-count {
      position: fixed;
      top: 22px;
      right: 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00;
      z-index: 50;
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 28px; height: 28px;
      z-index: 50;
      opacity: 0.5;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: #00ffff;
      box-shadow: 0 0 6px #00ffff;
    }
    .corner-tl { top: 14px; left: 14px; }
    .corner-tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner-bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner-br { bottom: 14px; right: 14px; transform: scale(-1); }
    .corner::before { top: 0; left: 0; width: 2px; height: 100%; }
    .corner::after  { top: 0; left: 0; width: 100%; height: 2px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <!-- Overlays -->
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="hud-title">HAND TRACKER</div>
  <div id="status">INITIALIZING HAND TRACKING…</div>
  <div id="touch-count">TOUCHES: <span id="tc">0</span></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="hand-label" id="label-left">LEFT</div>
  <div class="hand-label" id="label-right">RIGHT</div>

  <script>
  (() => {
    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const tcEl     = document.getElementById('tc');
    const lblL     = document.getElementById('label-left');
    const lblR     = document.getElementById('label-right');

    let W = 0, H = 0;
    let handResults = null;
    let particles   = [];
    let touchTotal  = 0;
    let prevTouching = {};
    let frameCount  = 0;

    // ─── Resize ───────────────────────────────────────────────
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ─── Landmark indices ─────────────────────────────────────
    const FINGERTIPS = [4, 8, 12, 16, 20];
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[0,17],[17,18],[18,19],[19,20]
    ];

    // ─── Particle ─────────────────────────────────────────────
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 0.018 + Math.random() * 0.025;
        this.radius = 1.5 + Math.random() * 3.5;
        this.color = color;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.93;
        this.vy *= 0.93;
        this.life -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.shadowBlur  = 20;
        ctx.shadowColor = this.color;
        ctx.fillStyle   = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ─── Color helpers ────────────────────────────────────────
    // Smooth gradient: cyan → magenta → yellow
    function stringColor(t) {
      t = Math.min(1, Math.max(0, t));
      let r, g, b;
      if (t < 0.5) {
        const k = t * 2;
        r = Math.round(k * 255);
        g = Math.round((1 - k) * 255);
        b = 255;
      } else {
        const k = (t - 0.5) * 2;
        r = 255;
        g = Math.round(k * 255);
        b = Math.round((1 - k) * 255);
      }
      return `rgb(${r},${g},${b})`;
    }

    // ─── Drawing helpers ──────────────────────────────────────
    function glowLine(x1, y1, x2, y2, color, lw, blur) {
      ctx.save();
      ctx.shadowBlur  = blur;
      ctx.shadowColor = color;
      ctx.strokeStyle = color;
      ctx.lineWidth   = lw;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function glowDot(x, y, color, r, blur) {
      ctx.save();
      ctx.shadowBlur  = blur;
      ctx.shadowColor = color;
      ctx.fillStyle   = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ─── Map landmark → canvas (mirrored) ────────────────────
    function lm2c(lm) {
      return { x: (1 - lm.x) * W, y: lm.y * H };
    }

    // ─── Laser-beam string ────────────────────────────────────
    function drawLaserString(x1, y1, x2, y2, color, alpha = 1) {
      const dx = x2 - x1, dy = y2 - y1;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const t    = Math.min(dist / (W * 0.75), 1);

      // Outer glow – wide, soft
      ctx.save();
      ctx.globalAlpha = alpha * 0.12;
      ctx.shadowBlur  = 60;
      ctx.shadowColor = color;
      ctx.strokeStyle = color;
      ctx.lineWidth   = 14;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();

      // Mid glow
      ctx.save();
      ctx.globalAlpha = alpha * 0.3;
      ctx.shadowBlur  = 25;
      ctx.shadowColor = color;
      ctx.strokeStyle = color;
      ctx.lineWidth   = 5 - t * 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();

      // Core – bright white-ish center
      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      ctx.shadowBlur  = 8;
      ctx.shadowColor = color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = Math.max(0.4, 1.5 - t * 1.2);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
    }

    // ─── Spawn particle explosion ─────────────────────────────
    function explode(x, y) {
      const palette = ['#00ffff', '#ff00ff', '#ffff00', '#ffffff', '#ff8844'];
      for (let i = 0; i < 32; i++) {
        particles.push(new Particle(x, y, palette[i % palette.length]));
      }
    }

    // ─── MediaPipe setup ──────────────────────────────────────
    const handsModel = new Hands({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    handsModel.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    handsModel.onResults((results) => {
      handResults = results;
    });

    // ─── Camera ───────────────────────────────────────────────
    const cam = new Camera(video, {
      onFrame: async () => { await handsModel.send({ image: video }); },
      width: 1280, height: 720
    });

    cam.start()
      .then(() => {
        statusEl.textContent = 'SHOW BOTH HANDS TO BEGIN';
        setTimeout(() => {
          statusEl.style.opacity = '0';
          statusEl.style.transition = 'opacity 2s';
        }, 4000);
      })
      .catch(() => {
        statusEl.textContent = '⚠ CAMERA ACCESS DENIED — PLEASE ALLOW PERMISSIONS';
      });

    // ─── Pulse animation value ────────────────────────────────
    let pulse = 0;

    // ─── Main render loop ─────────────────────────────────────
    function render() {
      requestAnimationFrame(render);
      frameCount++;
      pulse = Math.sin(frameCount * 0.04) * 0.5 + 0.5;

      // Background – deep midnight blue
      ctx.fillStyle = 'rgba(0, 6, 18, 0.88)';
      ctx.fillRect(0, 0, W, H);

      // Subtle horizontal grid lines (futuristic floor feel)
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 48) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let x = 0; x < W; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      ctx.restore();

      // Draw silhouette from video
      if (video.readyState >= 2) {
        ctx.save();
        ctx.globalAlpha = 0.10;
        ctx.filter = 'saturate(0) brightness(1.4) contrast(1.2)';
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, W, H);
        ctx.restore();
      }

      // Parse hand data
      const handsData = {};
      if (
        handResults &&
        handResults.multiHandLandmarks &&
        handResults.multiHandLandmarks.length > 0 &&
        handResults.multiHandedness
      ) {
        handResults.multiHandedness.forEach((info, i) => {
          // MediaPipe labels are from the model's perspective; mirror swap:
          const label = info.label === 'Left' ? 'Right' : 'Left';
          handsData[label] = handResults.multiHandLandmarks[i];
        });
      }

      const hasLeft  = !!handsData['Left'];
      const hasRight = !!handsData['Right'];

      // Update hand labels visibility
      lblL.classList.toggle('visible', hasLeft);
      lblR.classList.toggle('visible', hasRight);

      // ── Draw each hand ──────────────────────────────────────
      ['Left', 'Right'].forEach(side => {
        const lm = handsData[side];
        if (!lm) return;
        const isLeft  = side === 'Left';
        const baseHue = isLeft ? '#00ffff' : '#ff00ff';

        // Skeleton connections
        HAND_CONNECTIONS.forEach(([a, b]) => {
          const pa = lm2c(lm[a]);
          const pb = lm2c(lm[b]);
          glowLine(pa.x, pa.y, pb.x, pb.y, baseHue, 1.2, 12);
          glowLine(pa.x, pa.y, pb.x, pb.y, 'rgba(255,255,255,0.15)', 0.5, 2);
        });

        // Joints
        lm.forEach((pt, idx) => {
          const p   = lm2c(pt);
          const tip = FINGERTIPS.includes(idx);
          const dotColor = tip ? baseHue : (isLeft ? '#006688' : '#880066');
          const dotSize  = tip ? 6 + pulse * 2 : 3;
          const dotBlur  = tip ? 22 + pulse * 10 : 8;
          glowDot(p.x, p.y, dotColor, dotSize, dotBlur);
          if (tip) glowDot(p.x, p.y, '#ffffff', 2.5, 4); // bright core
        });
      });

      // ── Draw strings between both hands ─────────────────────
      if (hasLeft && hasRight) {
        const L = handsData['Left'];
        const R = handsData['Right'];

        FINGERTIPS.forEach((tipIdx, fi) => {
          const lp   = lm2c(L[tipIdx]);
          const rp   = lm2c(R[tipIdx]);
          const dx   = rp.x - lp.x;
          const dy   = rp.y - lp.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const t    = Math.min(dist / (W * 0.7), 1);
          const col  = stringColor(t + fi * 0.07);

          drawLaserString(lp.x, lp.y, rp.x, rp.y, col);

          // Touch detection
          const key = `t${tipIdx}`;
          const touching = dist < 32;
          if (touching && !prevTouching[key]) {
            touchTotal++;
            tcEl.textContent = touchTotal;
            explode((lp.x + rp.x) * 0.5, (lp.y + rp.y) * 0.5);
          }
          prevTouching[key] = touching;
        });

        // Cross-cradle strings (dashed, subtle)
        FINGERTIPS.forEach((lt, li) => {
          FINGERTIPS.forEach((rt, ri) => {
            if (Math.abs(li - ri) === 1) { // adjacent cross-links
              const lp   = lm2c(L[lt]);
              const rp   = lm2c(R[rt]);
              const dx   = rp.x - lp.x;
              const dy   = rp.y - lp.y;
              const dist = Math.sqrt(dx*dx + dy*dy);
              const t    = Math.min(dist / (W * 0.9), 1);
              const col  = stringColor(t + 0.3);

              ctx.save();
              ctx.globalAlpha = 0.22;
              ctx.setLineDash([6, 14]);
              ctx.shadowBlur  = 8;
              ctx.shadowColor = col;
              ctx.strokeStyle = col;
              ctx.lineWidth   = 0.7;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(lp.x, lp.y);
              ctx.lineTo(rp.x, rp.y);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.restore();
            }
          });
        });
      }

      // ── Particles ────────────────────────────────────────────
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(); p.draw(); });
    }

    render();
  })();
  </script>
</body>
</html>
