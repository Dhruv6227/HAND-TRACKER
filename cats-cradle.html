<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat's Cradle - Neon Strings</title>

  <!-- MediaPipe Hands + Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --primary: #00f0ff;
      --secondary: #ff0055;
      --accent: #ffdf00;
      --bg-dark: #050510;
      --glass-bg: rgba(10, 15, 30, 0.4);
      --glass-border: rgba(0, 240, 255, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 10;
    }

    /* Cinematic Overlays */
    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
      z-index: 20;
      pointer-events: none;
    }

    /* Glassmorphic UI Elements */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.2rem 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 50;
      position: absolute;
      transition: all 0.3s ease;
    }

    #header {
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      animation: pulseText 3s infinite alternate;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      font-weight: 300;
    }

    #stats-panel {
      top: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 140px;
    }

    #fps-panel {
      top: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
    }

    .stat-label {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(255, 223, 0, 0.5);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .combo-multiplier {
      font-size: 1.2rem;
      color: var(--secondary);
      text-shadow: 0 0 10px var(--secondary);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .combo-multiplier.active {
      opacity: 1;
      transform: translateY(0) scale(1.1);
      animation: pulseCombo 0.5s ease-out;
    }

    #status-indicator {
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: opacity 0.5s ease;
      padding: 0.75rem 1.5rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: blink 1.5s infinite;
    }

    .hand-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    #ind-left {
      left: 2rem;
      background: rgba(0, 240, 255, 0.1);
      border-left: 3px solid var(--primary);
      color: var(--primary);
      box-shadow: -10px 0 20px -10px var(--primary);
    }

    #ind-right {
      right: 2rem;
      background: rgba(255, 0, 85, 0.1);
      border-right: 3px solid var(--secondary);
      color: var(--secondary);
      box-shadow: 10px 0 20px -10px var(--secondary);
    }

    .hand-indicator.active {
      opacity: 1;
      transform: translateY(-50%) scale(1.05);
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(20px);
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-btn {
      margin-top: 2rem;
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      padding: 1rem 2.5rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);
      transition: all 0.3s ease;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .splash-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.4);
      transform: scale(1.05);
    }

    @keyframes pulseText {
      0% { filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3)); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 0, 85, 0.6)); }
    }

    @keyframes pulseCombo {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.5); filter: brightness(1.5); }
      100% { transform: scale(1.1); filter: brightness(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Clean subtle scanlines for texture */
    #texture {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <h1 class="title" style="font-size: clamp(2rem, 6vw, 4rem);">Neon Strings</h1>
    <p class="subtitle" style="margin-top: 1rem; text-align: center; max-width: 600px; line-height: 1.6;">
      An interactive, AI-powered Cat's Cradle simulation.<br/>
      Allow camera access and bring your hands into view.
    </p>
    <button class="splash-btn" id="start-btn">Initialize System</button>
  </div>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="texture"></div>
    <div id="vignette"></div>

    <!-- UI Overlay -->
    <div id="header" class="glass-panel">
      <h1 class="title">Neon Strings</h1>
      <div class="subtitle">Cat's Cradle Hand Tracker</div>
    </div>

    <div id="fps-panel" class="glass-panel">
      <div class="stat-label">FPS / System</div>
      <div class="stat-value" id="fps-count" style="font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5);">60</div>
    </div>

    <div id="stats-panel" class="glass-panel">
      <div class="stat-label">Connections</div>
      <div class="stat-value" id="touch-count">0</div>
      <div class="combo-multiplier" id="combo-display">x1 Combo</div>
    </div>

    <div id="status-indicator" class="glass-panel">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">WAITING FOR INITIALIZATION...</span>
    </div>

    <div class="hand-indicator" id="ind-left">LEFT HAND DETECTED</div>
    <div class="hand-indicator" id="ind-right">RIGHT HAND DETECTED</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById('splash');
      const startBtn = document.getElementById('start-btn');
      
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false }); 
      
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      const tcEl = document.getElementById('touch-count');
      const comboEl = document.getElementById('combo-display');
      const fpsEl = document.getElementById('fps-count');
      const indLeft = document.getElementById('ind-left');
      const indRight = document.getElementById('ind-right');

      let W = 0, H = 0;
      let handResults = null;
      let particles = [];
      let ambientOrbs = [];
      let touchTotal = 0;
      let prevTouching = {};
      let frameCount = 0;
      let isCameraReady = false;
      let systemStarted = false;
      
      // FPS and Combo Tracking
      let lastTime = performance.now();
      let comboCount = 1;
      let comboTimer = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        initAmbientOrbs();
      }
      window.addEventListener('resize', resize);
      resize();

      const FINGERTIPS = [4, 8, 12, 16, 20];
      const HAND_CONNECTIONS = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],
        [13,17],[0,17],[17,18],[18,19],[19,20]
      ];

      // Ambient Background Orbs
      class AmbientOrb {
        constructor() {
          this.reset();
          this.x = Math.random() * W;
          this.y = Math.random() * H;
        }
        reset() {
          this.x = Math.random() * W;
          this.y = H + 100;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = - (Math.random() * 1 + 0.2);
          this.radius = Math.random() * 40 + 10;
          const colors = ['rgba(0, 240, 255, 0.03)', 'rgba(255, 0, 85, 0.03)', 'rgba(255, 223, 0, 0.02)'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.wobble = Math.random() * Math.PI * 2;
          this.wobbleSpeed = Math.random() * 0.02 + 0.01;
        }
        update() {
          this.x += this.vx + Math.sin(this.wobble) * 0.5;
          this.y += this.vy;
          this.wobble += this.wobbleSpeed;
          if (this.y < -100) this.reset();
        }
        draw(ctx) {
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          ctx.beginPath();
          const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
          gradient.addColorStop(0, this.color.replace(/0\.0[23]\)$/, '0.1)'));
          gradient.addColorStop(1, 'transparent');
          ctx.fillStyle = gradient;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function initAmbientOrbs() {
        ambientOrbs = [];
        for (let i = 0; i < 25; i++) {
          ambientOrbs.push(new AmbientOrb());
        }
      }
      initAmbientOrbs();

      class Particle {
        constructor(x, y, color, isCore = false) {
          this.x = x; this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = isCore ? (2 + Math.random() * 4) : (4 + Math.random() * 12);
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.life = 1.0;
          this.decay = isCore ? 0.02 : (0.015 + Math.random() * 0.03);
          this.radius = isCore ? (4 + Math.random() * 3) : (1.5 + Math.random() * 3);
          this.color = isCore ? '#ffffff' : color;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.90;
          this.vy *= 0.90;
          this.life -= this.decay;
        }
        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.life);
          ctx.shadowBlur = 15;
          ctx.shadowColor = this.color;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function explode(x, y, comboMultiplier = 1) {
        const palette = ['#00f0ff', '#ff0055', '#ffdf00'];
        const count = Math.min(60, 20 + comboMultiplier * 5);
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y, palette[i % palette.length]));
        }
        // Core white flashes
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(x, y, '#fff', true));
        }
      }

      function stringColor(t) {
        t = Math.max(0, Math.min(1, t));
        // Cyan to Magenta to Yellow
        if (t < 0.5) {
          const k = t * 2;
          return `rgb(${Math.round(k*255)}, ${Math.round((1-k)*240)}, 255)`;
        } else {
          const k = (t - 0.5) * 2;
          return `rgb(255, ${Math.round(k*223)}, ${Math.round((1-k)*85)})`;
        }
      }

      function lm2c(lm) {
        return { x: (1 - lm.x) * W, y: lm.y * H };
      }

      function glowLine(x1, y1, x2, y2, color, lw, blur) {
        ctx.save();
        ctx.shadowBlur = blur;
        ctx.shadowColor = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function glowDot(x, y, color, r, blur) {
        ctx.save();
        ctx.shadowBlur = blur;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawLaserString(x1, y1, x2, y2, color, thicknessMultiplier = 1) {
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 20 * thicknessMultiplier;
        ctx.shadowColor = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3 * thicknessMultiplier;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 5;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1 * thicknessMultiplier;
        ctx.stroke();
        ctx.restore();
      }

      // Initialize MediaPipe
      const handsModel = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
      });

      handsModel.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });

      handsModel.onResults((results) => {
        handResults = results;
      });

      const cam = new Camera(video, {
        onFrame: async () => {
          if (!isCameraReady) {
            isCameraReady = true;
            statusText.textContent = "READY - SHOW HANDS";
            statusDot.style.backgroundColor = "var(--accent)";
            statusDot.style.boxShadow = "0 0 10px var(--accent)";
            setTimeout(() => {
              const el = document.getElementById('status-indicator');
              if(el) el.style.opacity = '0';
            }, 3000);
          }
          await handsModel.send({ image: video });
        },
        width: 1280, height: 720
      });

      startBtn.addEventListener('click', () => {
        splash.classList.add('hidden');
        systemStarted = true;
        statusText.textContent = "INITIALIZING CAMERA...";
        
        cam.start().catch((err) => {
          console.error(err);
          statusText.textContent = "CAMERA ACCESS DENIED";
          statusDot.style.backgroundColor = "red";
          splash.classList.remove('hidden');
        });
        
        render();
      });

      function render() {
        if (!systemStarted) return;
        requestAnimationFrame(render);
        
        const now = performance.now();
        const dt = now - lastTime;
        lastTime = now;
        
        frameCount++;
        
        if (frameCount % 10 === 0) {
          fpsEl.textContent = Math.round(1000 / dt);
        }

        // Handle Combo Decay
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) {
            comboCount = 1;
            comboEl.classList.remove('active');
          }
        }

        // Clear and draw background
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, W, H);
        
        // Draw Ambient Orbs
        ambientOrbs.forEach(orb => {
          orb.update();
          orb.draw(ctx);
        });

        // Draw video feedback subtly
        if (isCameraReady && video.readyState >= 2) {
          ctx.save();
          ctx.globalAlpha = 0.12;
          ctx.filter = 'saturate(1.2) contrast(1.2) sepia(0.3) hue-rotate(180deg)';
          ctx.translate(W, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, W, H);
          ctx.restore();
        }

        const handsData = {};
        if (handResults && handResults.multiHandLandmarks && handResults.multiHandedness) {
          handResults.multiHandedness.forEach((info, i) => {
            const label = info.label === 'Left' ? 'Right' : 'Left'; // mirror
            handsData[label] = handResults.multiHandLandmarks[i];
          });
        }

        const hasLeft = !!handsData['Left'];
        const hasRight = !!handsData['Right'];

        indLeft.classList.toggle('active', hasLeft);
        indRight.classList.toggle('active', hasRight);

        // Draw Hands
        ['Left', 'Right'].forEach(side => {
          const lm = handsData[side];
          if (!lm) return;
          
          const isLeft = side === 'Left';
          const baseCol = isLeft ? '#00f0ff' : '#ff0055';

          HAND_CONNECTIONS.forEach(([a, b]) => {
            const pa = lm2c(lm[a]), pb = lm2c(lm[b]);
            glowLine(pa.x, pa.y, pb.x, pb.y, baseCol, 2, 10);
            glowLine(pa.x, pa.y, pb.x, pb.y, 'rgba(255,255,255,0.4)', 1, 2);
          });

          lm.forEach((pt, idx) => {
            const p = lm2c(pt);
            const isTip = FINGERTIPS.includes(idx);
            if (isTip) {
              const pulse = Math.sin(frameCount * 0.1) * 2;
              glowDot(p.x, p.y, baseCol, 6 + pulse, 15);
              glowDot(p.x, p.y, '#ffffff', 3, 5);
            } else {
              glowDot(p.x, p.y, baseCol, 3, 8);
            }
          });
        });

        // Draw Strings between hands
        if (hasLeft && hasRight) {
          const L = handsData['Left'];
          const R = handsData['Right'];

          // Direct fingertip connections
          FINGERTIPS.forEach((tipIdx, fi) => {
            const lp = lm2c(L[tipIdx]);
            const rp = lm2c(R[tipIdx]);
            const dist = Math.hypot(rp.x - lp.x, rp.y - lp.y);
            const col = stringColor(Math.min(dist / (W * 0.5), 1) + fi * 0.1);

            // Thicker lines based on combo
            const thickness = 1 + (comboCount * 0.1);
            drawLaserString(lp.x, lp.y, rp.x, rp.y, col, thickness);

            // Interaction / Touch
            const key = `t${tipIdx}`;
            const touching = dist < 45; // slightly larger hit area
            if (touching && !prevTouching[key]) {
              touchTotal += comboCount;
              tcEl.textContent = touchTotal;
              
              // Handle combo
              comboCount++;
              comboTimer = 2500; // 2.5s to keep combo alive
              if (comboCount > 1) {
                comboEl.textContent = `x${comboCount} COMBO!`;
                comboEl.classList.add('active');
                comboEl.style.animation = 'none';
                comboEl.offsetHeight; /* trigger reflow */
                comboEl.style.animation = null; 
              }

              tcEl.style.transform = `scale(${1.2 + comboCount * 0.05})`;
              setTimeout(() => { tcEl.style.transform = 'scale(1)'; }, 150);
              
              explode((lp.x + rp.x) * 0.5, (lp.y + rp.y) * 0.5, comboCount);
            }
            prevTouching[key] = touching;
          });

          // Cross links
          FINGERTIPS.forEach((lt, li) => {
            FINGERTIPS.forEach((rt, ri) => {
              if (Math.abs(li - ri) === 1) {
                const lp = lm2c(L[lt]), rp = lm2c(R[rt]);
                const dist = Math.hypot(rp.x - lp.x, rp.y - lp.y);
                const col = stringColor(Math.min(dist / (W * 0.8), 1));
                
                ctx.save();
                ctx.globalAlpha = 0.2 + (comboCount * 0.05);
                ctx.setLineDash([5, 10]);
                ctx.strokeStyle = col;
                ctx.lineWidth = 1 + (comboCount * 0.1);
                ctx.beginPath();
                ctx.moveTo(lp.x, lp.y);
                ctx.lineTo(rp.x, rp.y);
                ctx.stroke();
                ctx.restore();
              }
            });
          });
        }

        // Draw Particles
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(ctx); });
      }
    });
  </script>
</body>
</html>
